name = "refrain"
main = "src/index.ts"
compatibility_date = "2026-04-18"

# 本番は Workers Custom Domain（専用サブドメイン）だけで受ける。workers.dev とプレビュー URL は、
# アップロード口が別のホスト名でも開いてしまうので無効にする。動作確認は `wrangler dev` で行う。
workers_dev = false
preview_urls = false

# Custom Domain は**ここに書かない**。本リポジトリは Public のため、ドメインを設定ファイルに残さない。
# デプロイ時に CLI フラグで渡す（CI では .github/workflows/deploy-refrain.yml が secrets.REFRAIN_DOMAIN から渡す）:
#   wrangler deploy --domain "$REFRAIN_DOMAIN"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "refrain"
