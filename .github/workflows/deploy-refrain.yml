name: Deploy refrain

on:
  push:
    branches: [main]
    paths:
      - 'apps/refrain/worker/**'
      - 'bun.lock'
      - 'turbo.json'
      # turbo の globalDependencies と、ツールのバージョンを決める root のファイル
      - 'package.json'
      - 'eslint.config.js'
      - 'tsconfig.base.json'
      - 'bunfig.toml'
      - '.tool-versions'
      - '.github/actions/setup/**'
      - '.github/workflows/deploy-refrain.yml'
  workflow_dispatch:

concurrency:
  group: deploy-refrain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID REFRAIN_DOMAIN; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set"
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REFRAIN_DOMAIN: ${{ secrets.REFRAIN_DOMAIN }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      # turbo の deploy タスクは dependsOn: ["test"] なので、refrain-worker のテストが通ってからデプロイする。
      # `--` 以降の引数は deploy にだけ渡る（test には渡らない）。
      # Custom Domain のホスト名は、公開リポジトリに書かないため secret で渡す。
      # vars ではなく secrets を使うこと（vars はワークフローのログに平文で出る）。
      - name: Test and deploy worker
        run: bunx turbo run deploy --filter=refrain-worker -- --domain "$REFRAIN_DOMAIN"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REFRAIN_DOMAIN: ${{ secrets.REFRAIN_DOMAIN }}
