name: Deploy refrain

on:
  push:
    branches: [main]
    paths:
      - 'apps/refrain/worker/**'
      - 'bun.lock'
      - '.github/workflows/deploy-refrain.yml'
  workflow_dispatch:

concurrency:
  group: deploy-refrain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # secrets を登録するまでは deploy を飛ばす（main が赤くならないようにする）。
      # 登録後は、未登録をエラーにする形に戻す。
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$REFRAIN_ROUTE" ]; then
            echo "::warning::Cloudflare の secrets が未登録のため deploy を飛ばした"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REFRAIN_ROUTE: ${{ secrets.REFRAIN_ROUTE }}

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        if: steps.secrets.outputs.ready == 'true'
        uses: ./.github/actions/setup

      # ルートパターンは独自ドメインを含むため、リポジトリではなく secret で渡す。
      # vars ではなく secrets を使うこと（vars はワークフローログに平文で出力される）。
      # wrangler.toml 側に [[routes]] は持たせていない。
      - name: Deploy worker
        if: steps.secrets.outputs.ready == 'true'
        run: bun run --filter refrain-worker deploy -- --routes "$REFRAIN_ROUTE"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REFRAIN_ROUTE: ${{ secrets.REFRAIN_ROUTE }}
