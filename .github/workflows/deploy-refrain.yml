name: Deploy refrain

on:
  push:
    branches: [main]
    paths:
      - 'apps/refrain/worker/**'
      - 'bun.lock'
      - '.github/workflows/deploy-refrain.yml'
  workflow_dispatch:

concurrency:
  group: deploy-refrain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # secrets を登録するまでは deploy を飛ばす（main が赤くならないようにする）。
      # 登録後は、未登録をエラーにする形に戻す。
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$REFRAIN_ROUTE" ]; then
            echo "::warning::Cloudflare の secrets が未登録のため deploy を飛ばした"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REFRAIN_ROUTE: ${{ secrets.REFRAIN_ROUTE }}

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # wrangler・tsc・ESLint を .tool-versions の Node で動かす（ランナーに最初から入っている Node に頼らない）
      - name: Setup Node
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Setup Bun
        if: steps.secrets.outputs.ready == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      # ルートパターンは独自ドメインを含むため、リポジトリではなく secret で渡す。
      # vars ではなく secrets を使うこと（vars はワークフローログに平文で出力される）。
      # wrangler.toml 側に [[routes]] は持たせていない。
      - name: Deploy worker
        if: steps.secrets.outputs.ready == 'true'
        run: bun run --filter refrain-worker deploy -- --routes "$REFRAIN_ROUTE"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REFRAIN_ROUTE: ${{ secrets.REFRAIN_ROUTE }}
