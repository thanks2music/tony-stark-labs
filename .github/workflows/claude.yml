name: Claude Code

# @claude メンションに応答する interactive mode。anthropics/claude-code-action の examples/claude.yml に準拠。
# 起動できるのはリポジトリへの write 権限を持つユーザーのみ (action 側で検査される)。
#
# 権限モード: v1.0.273 (2026-11-12) から既定は auto mode。ファイル編集は許可なしで進み、
# 許可ルールに無い操作は Claude Code の安全審査が判断する (公式 security.md は、使える環境では auto を推奨)。
# 許可リストを厳密にしたい場合は claude_args に `--permission-mode acceptEdits` を足す
# (ファイル編集は許可し、ルールに無い操作は拒否する。v1.0.272 までの既定)。
#
# action は commit SHA で固定している。更新は Dependabot (package-ecosystem: github-actions) に任せる。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# job 側で必要な分だけ付ける
permissions: {}

# issue_comment などのトリガーは zizmor が dangerous-triggers として警告するが、@claude 応答には必須。
# 起動者の write 権限は action が検査する。concurrency は付けない (作業中の run を止めると push が途中で切れる)

jobs:
  claude:
    name: Claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # 公式 examples/claude.yml と同じ。既定では Claude App のトークンで操作するが、
      # github_token に GITHUB_TOKEN を渡す構成でも動くように write にしておく
      contents: write # ブランチへの push (github_token に GITHUB_TOKEN を渡す構成の場合)
      pull-requests: write # PR へのコメント・更新 (同上)
      issues: write # Issue へのコメント (同上)
      id-token: write # Claude GitHub App のトークン交換 (OIDC) に必須
      actions: read # PR の CI 結果を Claude が読めるように

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1.0.289
        with:
          # Console の API キーを使う場合は `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` に置き換える
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # CI 結果の読み取りを App トークンにも付与する
          additional_permissions: |
            actions: read

          # ターン数の上限 (公式 docs「Manage costs」)。モデルなど他の CLI 引数もここに足す
          claude_args: |
            --max-turns 30
